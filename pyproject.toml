[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dazo"
version = "0.0.1"
description = "Adaptive recurrent latent decision model"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.48",
  "huggingface-hub>=0.27",
]

[project.optional-dependencies]
train = ["datasets>=3", "tqdm>=4.66", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["dazo*"]
