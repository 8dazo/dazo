name: Smoke Dazo with mmBERT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-mmbert.yml'
      - 'dazo/configuration_dazo.py'
      - 'dazo/modeling_dazo.py'
      - 'train.py'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install 'transformers>=4.48' huggingface-hub safetensors
      - name: Run train, save, reload, and forward smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          import torch
          from transformers import AutoTokenizer
          from dazo.configuration_dazo import DazoConfig
          from dazo.data import DazoCollator
          from dazo.losses import compute_dazo_loss
          from dazo.modeling_dazo import DazoForDecision

          cfg = DazoConfig(
              backbone_name='jhu-clsp/mmBERT-small',
              context_max_length=128,
              option_max_length=16,
              latent_dim=128,
              n_evidence_slots=4,
              n_hypothesis_slots=4,
              n_critic_slots=2,
              n_control_slots=2,
              layers_per_loop=1,
              num_attention_heads=4,
              max_steps=2,
              freeze_backbone=True,
          )
          tok = AutoTokenizer.from_pretrained(cfg.backbone_name)
          collate = DazoCollator(tok, cfg.context_max_length, cfg.option_max_length)
          batch = collate([
              {
                  'state': 'A robin is a bird. All birds are animals.',
                  'instruction': 'Is a robin an animal?',
                  'type': 'choice',
                  'options': [
                      {'id': 'true', 'text': 'entailed'},
                      {'id': 'false', 'text': 'contradicted'},
                      {'id': 'unknown', 'text': 'not enough information'},
                  ],
                  'label': 'true',
              },
              {
                  'state': 'A salmon is a fish. No fish is a mammal.',
                  'instruction': 'Is a salmon a mammal?',
                  'type': 'choice',
                  'options': [
                      {'id': 'true', 'text': 'entailed'},
                      {'id': 'false', 'text': 'contradicted'},
                      {'id': 'unknown', 'text': 'not enough information'},
                  ],
                  'label': 'false',
              },
          ])

          # Fresh-training path must initialize from pretrained mmBERT.
          model = DazoForDecision.from_backbone_pretrained(cfg)
          model.train()
          model.backbone.eval()
          optimizer = torch.optim.AdamW([p for p in model.parameters() if p.requires_grad], lr=1e-4)
          out = model(
              input_ids=batch['input_ids'],
              attention_mask=batch['attention_mask'],
              option_input_ids=batch['option_input_ids'],
              option_attention_mask=batch['option_attention_mask'],
              option_mask=batch['option_mask'],
              task_type=batch['task_type'],
              rank_ids=batch['rank_ids'],
              max_steps=2,
          )
          loss, parts = compute_dazo_loss(out, batch['labels'], batch['option_mask'], batch['is_ood'])
          assert torch.isfinite(loss), loss
          loss.backward()
          assert any(p.grad is not None and torch.isfinite(p.grad).all() for p in model.core.parameters() if p.requires_grad)
          assert all(p.grad is None for p in model.backbone.parameters())
          optimizer.step()

          # Exact regression for the Colab failure: save a Dazo checkpoint, then
          # construct/load it through PreTrainedModel.from_pretrained().
          with tempfile.TemporaryDirectory() as td:
              model.save_pretrained(td)
              tok.save_pretrained(td)

              reloaded = DazoForDecision.from_pretrained(td).eval()
              with torch.inference_mode():
                  reloaded_out = reloaded(
                      input_ids=batch['input_ids'],
                      attention_mask=batch['attention_mask'],
                      option_input_ids=batch['option_input_ids'],
                      option_attention_mask=batch['option_attention_mask'],
                      option_mask=batch['option_mask'],
                      task_type=batch['task_type'],
                      rank_ids=batch['rank_ids'],
                      max_steps=2,
                  )
              assert torch.isfinite(reloaded_out['logits']).all()

              # Also emulate the already-produced legacy pilot config, which did
              # not contain backbone_config yet.
              cfg_path = Path(td) / 'config.json'
              raw = json.loads(cfg_path.read_text())
              raw.pop('backbone_config', None)
              cfg_path.write_text(json.dumps(raw))
              legacy_reload = DazoForDecision.from_pretrained(td).eval()
              with torch.inference_mode():
                  legacy_out = legacy_reload(
                      input_ids=batch['input_ids'],
                      attention_mask=batch['attention_mask'],
                      option_input_ids=batch['option_input_ids'],
                      option_attention_mask=batch['option_attention_mask'],
                      option_mask=batch['option_mask'],
                      task_type=batch['task_type'],
                      rank_ids=batch['rank_ids'],
                      max_steps=2,
                  )
              assert torch.isfinite(legacy_out['logits']).all()

          print('Dazo/mmBERT train + checkpoint reload smoke OK')
          print('loss=', float(loss.detach()))
          print('parts=', {k: float(v) for k, v in parts.items()})
          print('trainable_params=', sum(p.numel() for p in model.parameters() if p.requires_grad))
          print('total_params=', sum(p.numel() for p in model.parameters()))
          PY
