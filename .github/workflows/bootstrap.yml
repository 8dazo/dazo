name: Bootstrap Dazo source

on:
  push:
    branches: [main]
    paths:
      - dazo-starter.zip
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand Dazo starter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap-dazo
          mkdir .bootstrap-dazo
          unzip -q dazo-starter.zip -d .bootstrap-dazo
          cp -a .bootstrap-dazo/dazo/. ./
          rm -rf .bootstrap-dazo dazo-starter.zip
          rm -f .github/workflows/bootstrap.yml
      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Bootstrap Dazo v0 source"
          git push
